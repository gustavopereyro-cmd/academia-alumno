<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instituto Mariana Barrera · Aula Virtual</title>
<link rel="icon" href="logo-loto.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:#E8B4B0;
    --rose-soft:#F5D5D0;
    --rose-deep:#C98F8A;
    --cream:#FDFBF9;
    --paper:#F7F2EE;
    --ink:#4A4444;
    --ink-soft:#8A8280;
    --line:#EDE4DE;
    --white:#FFFFFF;
    --error:#C97B74;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--cream); color:var(--ink);
    font-family:'Jost', sans-serif;
    font-weight:300;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Cormorant Garamond', serif; font-weight:500; letter-spacing:.005em;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 28px;}

  /* ---------- LOGIN ---------- */
  #login-screen{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, #FDFBF9 0%, #F5D5D0 100%);
    z-index:100; padding:20px;
  }
  .login-box{
    background:var(--white);
    padding:56px 48px;
    border-radius:2px;
    width:100%; max-width:420px;
    box-shadow:0 30px 60px -20px rgba(201,143,138,.25);
    border-top:3px solid var(--rose);
    text-align:center;
  }
  .login-logo{
    width:220px; max-width:100%;
    margin:0 auto 26px; display:block;
  }
  .login-box h1{font-size:30px; color:var(--ink); margin-bottom:4px; font-weight:600;}
  .login-box .sub{
    color:var(--ink-soft); font-size:11.5px;
    text-transform:uppercase; letter-spacing:.28em;
    margin-bottom:32px; font-weight:400;
  }
  .login-box input{
    width:100%; padding:14px 16px; margin-bottom:14px;
    font-family:'Jost',sans-serif; font-size:15px; font-weight:300;
    border:1px solid var(--line); border-radius:2px;
    background:var(--cream); color:var(--ink);
    transition:border-color .2s, background .2s;
  }
  .login-box input:focus{
    outline:none; border-color:var(--rose); background:var(--white);
  }
  .login-error{color:var(--error); font-size:13px; min-height:20px; margin-bottom:8px;}
  .btn-login{
    width:100%;
    font-family:'Jost',sans-serif; font-size:13px; font-weight:500;
    text-transform:uppercase; letter-spacing:.22em;
    background:var(--ink); color:var(--white);
    border:none; padding:15px; border-radius:2px;
    cursor:pointer; transition:all .3s ease;
  }

  /* ---------- HEADER ---------- */
  header{
    padding:48px 0 36px;
    border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; gap:24px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:20px;}
  .brand img{width:64px; height:auto;}
  .brand-text h1{font-size:clamp(24px,3vw,32px); line-height:1; color:var(--ink);}
  .brand-text .eyebrow{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.32em;
    color:var(--rose-deep); margin-bottom:6px; font-weight:500;
  }
  .brand-text .sub{font-size:12.5px; color:var(--ink-soft); margin-top:4px; font-style:italic;}
  .saludo{text-align:right; font-size:14px; color:var(--ink-soft);}
  .saludo strong{color:var(--ink); font-weight:500; font-family:'Cormorant Garamond',serif; font-size:18px; display:block;}
  .btn-salir{
    background:none; border:none; color:var(--rose-deep);
    font-family:'Jost',sans-serif; font-size:11px; font-weight:500;
    text-transform:uppercase; letter-spacing:.2em; cursor:pointer;
    margin-top:6px; padding:4px 0; border-bottom:1px solid transparent;
    transition:border-color .2s;
  }

  /* ---------- MAIN ---------- */
  main{padding:48px 0 100px;}
  #estado{color:var(--ink-soft); font-size:14px; margin-bottom:28px; font-style:italic;}
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr));
    gap:32px;
  }

  /* ---------- CARD CURSO ---------- */
  .curso{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:2px;
    overflow:hidden;
    display:flex; flex-direction:column;
    transition:transform .4s ease, box-shadow .4s ease;
    position:relative;
  }
  .curso::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--rose-soft), var(--rose), var(--rose-soft));
    transform:scaleX(0); transform-origin:left;
    transition:transform .5s ease;
  }
  .curso-img{
    width:100%; aspect-ratio:16/10; object-fit:cover;
    background:var(--paper); display:block;
  }
  .curso-body{padding:26px 24px 22px; display:flex; flex-direction:column; gap:12px; flex:1;}
  .curso-body .eyebrow{
    font-size:10px; text-transform:uppercase; letter-spacing:.3em;
    color:var(--rose-deep); font-weight:500;
  }
  .curso-body h3{font-size:26px; line-height:1.15; color:var(--ink);}
  .curso-body p.desc{font-size:14px; color:var(--ink-soft); flex:1; line-height:1.7;}
  .meta{
    display:flex; flex-wrap:wrap; gap:8px;
    font-size:11px; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.12em;
  }
  .meta span{
    border:1px solid var(--line); border-radius:2px;
    padding:5px 11px; font-weight:400;
  }
  .btn-ver{
    margin-top:10px; align-self:flex-start;
    font-family:'Jost',sans-serif; font-size:11.5px; font-weight:500;
    text-transform:uppercase; letter-spacing:.22em;
    background:transparent; color:var(--ink);
    border:1px solid var(--ink);
    padding:12px 22px; border-radius:2px; cursor:pointer;
    transition:all .3s ease;
  }

  .desc-larga{
    font-size:14.5px; color:var(--ink-soft); line-height:1.8;
    white-space:pre-line; padding-left:16px; border-left:2px solid var(--rose-soft);
  }
  .lista-pdf a{
    display:flex; align-items:center; gap:10px;
    font-size:14px; color:var(--ink); text-decoration:none;
    padding:13px 16px; border:1px solid var(--line); border-radius:2px;
    background:var(--white); margin-bottom:8px;
    transition:all .25s ease;
  }
  .lista-pdf a::before{content:'↓'; font-size:14px; color:var(--rose-deep); font-weight:500;}

  /* ---------- TÍTULOS DE SECCIÓN ---------- */
  .seccion-titulo{
    display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap;
    margin-bottom:24px;
  }
  .seccion-titulo h2{font-size:clamp(26px,3vw,32px); color:var(--ink); line-height:1.1;}
  .seccion-titulo p{font-size:13.5px; color:var(--ink-soft); font-style:italic; margin-top:4px;}
  .link-cert{
    background:none; border:none; cursor:pointer; padding:4px 0;
    font-family:'Jost',sans-serif; font-size:11px; font-weight:500;
    text-transform:uppercase; letter-spacing:.2em; color:var(--rose-deep);
    border-bottom:1px solid transparent;
  }

  /* ---------- MIS CERTIFICADOS ---------- */
  #mis-certificados{margin-top:72px; padding-top:44px; border-top:1px solid var(--line); scroll-margin-top:16px;}
  .grid-cert{display:grid; grid-template-columns:repeat(auto-fill, minmax(330px,1fr)); gap:20px;}
  .cert{
    display:flex; gap:20px; align-items:flex-start;
    background:var(--white); border:1px solid var(--line); border-radius:2px;
    padding:24px 22px; position:relative; overflow:hidden;
  }
  .cert::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--rose-soft), var(--rose), var(--rose-soft));
  }
  .sello{
    flex-shrink:0; width:54px; height:54px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--rose-soft); color:var(--rose-deep);
  }
  .sello svg{width:28px; height:28px;}
  .cert-info{flex:1; min-width:0;}
  .cert-info .eyebrow{font-size:10px; text-transform:uppercase; letter-spacing:.3em; color:var(--rose-deep); font-weight:500;}
  .cert-info h4{font-size:21px; line-height:1.2; color:var(--ink); margin:4px 0 6px;}
  .cert-meta{font-size:12px; color:var(--ink-soft); letter-spacing:.04em;}
  .cert-acciones{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px;}
  .btn-cert{
    display:inline-block; text-decoration:none; cursor:pointer;
    font-family:'Jost',sans-serif; font-size:10.5px; font-weight:500;
    text-transform:uppercase; letter-spacing:.18em;
    padding:10px 16px; border-radius:2px;
    border:1px solid var(--ink); color:var(--ink); background:transparent;
    transition:all .25s ease;
  }
  .btn-cert.primario{background:var(--ink); color:var(--white);}

  .banner-cert{
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    background:linear-gradient(135deg, #FFFFFF 0%, var(--rose-soft) 100%);
    border:1px solid var(--rose); border-radius:2px;
    padding:18px 22px; margin-bottom:24px;
  }
  .banner-cert .sello{width:46px; height:46px; background:var(--white);}
  .banner-cert .sello svg{width:24px; height:24px;}
  .banner-cert .texto{flex:1; min-width:200px;}
  .banner-cert strong{display:block; font-family:'Cormorant Garamond',serif; font-size:21px; font-weight:600; color:var(--ink);}
  .banner-cert span{font-size:13.5px; color:var(--ink-soft);}

  /* ---------- VISTA DEL CURSO ---------- */
  #vista-curso{display:none; animation:aparecer .35s ease;}
  @keyframes aparecer{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .curso-top{
    display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap;
    padding-bottom:22px; margin-bottom:22px; border-bottom:1px solid var(--line);
  }
  .btn-volver{
    background:none; border:none; cursor:pointer; padding:4px 0; margin-bottom:12px;
    font-family:'Jost',sans-serif; font-size:11px; font-weight:500;
    text-transform:uppercase; letter-spacing:.2em; color:var(--rose-deep);
    border-bottom:1px solid transparent;
  }
  .curso-top h2{font-size:clamp(26px,3.4vw,38px); line-height:1.1; color:var(--ink);}
  .avance{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.18em; white-space:nowrap;}
  .barra-avance{width:180px; height:3px; background:var(--line); margin-top:8px; border-radius:2px; overflow:hidden;}
  .barra-avance span{display:block; height:100%; background:var(--rose-deep); transition:width .4s ease;}

  .sobre-curso{background:var(--white); border:1px solid var(--line); border-radius:2px; margin-bottom:28px;}
  .sobre-curso summary{
    cursor:pointer; padding:14px 18px; list-style:none;
    font-size:10.5px; font-weight:500; text-transform:uppercase; letter-spacing:.24em; color:var(--rose-deep);
  }
  .sobre-curso summary::-webkit-details-marker{display:none;}
  .sobre-curso summary::after{content:' +'; }
  .sobre-curso[open] summary::after{content:' –';}
  .sobre-curso .desc-larga{margin:0 18px 18px;}

  .layout-curso{display:grid; grid-template-columns:minmax(250px,320px) 1fr; gap:36px; align-items:start;}
  .lista-clases{
    position:sticky; top:20px; max-height:calc(100vh - 40px); overflow-y:auto;
    background:var(--white); border:1px solid var(--line); border-radius:2px;
  }
  .titulo-lista{
    padding:15px 18px; border-bottom:1px solid var(--line);
    font-size:10.5px; font-weight:500; text-transform:uppercase; letter-spacing:.24em; color:var(--rose-deep);
  }
  .item-clase{
    display:flex; gap:14px; width:100%; text-align:left; cursor:pointer;
    background:none; border:none; border-bottom:1px solid var(--line);
    padding:14px 18px; font-family:'Jost',sans-serif; color:var(--ink);
    transition:background .2s;
  }
  .item-clase:last-child{border-bottom:none;}
  .item-clase .num{font-size:11px; font-weight:500; color:var(--rose-deep); letter-spacing:.12em; padding-top:3px; min-width:22px;}
  .item-clase .txt{flex:1; min-width:0;}
  .item-clase .txt strong{display:block; font-weight:400; font-size:14.5px; line-height:1.4;}
  .item-clase .txt small{font-size:11px; color:var(--ink-soft); letter-spacing:.04em;}
  .item-clase.activa{background:var(--rose-soft); box-shadow:inset 3px 0 0 var(--rose-deep);}
  .item-clase.activa .txt strong{font-weight:500;}

  .zona-clase{min-width:0; scroll-margin-top:16px;}
  .eyebrow-clase{font-size:10.5px; font-weight:500; text-transform:uppercase; letter-spacing:.28em; color:var(--rose-deep);}
  .zona-clase h3{font-size:clamp(24px,2.8vw,32px); line-height:1.15; margin:6px 0 20px; color:var(--ink);}
  .reproductor{
    position:relative; width:100%; aspect-ratio:16/9; background:#1F1B1B;
    border-radius:2px; overflow:hidden; box-shadow:0 22px 50px -26px rgba(74,68,68,.5);
  }
  .reproductor iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  /* ---------- AVANCE ---------- */
  .prog-curso{margin-top:2px;}
  .prog-barra{height:4px; background:var(--line); border-radius:2px; overflow:hidden;}
  .prog-barra span{display:block; height:100%; background:var(--rose-deep); transition:width .4s ease;}
  .prog-curso small{display:block; margin-top:7px; font-size:11.5px; color:var(--ink-soft); letter-spacing:.04em;}
  .item-clase .check{
    width:20px; height:20px; border-radius:50%; flex-shrink:0; margin-top:1px;
    border:1.5px solid #DCCFC8; display:flex; align-items:center; justify-content:center;
    font-size:11px; color:transparent; transition:all .25s ease;
  }
  .item-clase.hecha .check{background:#5E8C61; border-color:#5E8C61; color:#fff;}
  .item-cont .ico{position:relative;}
  .item-cont .tilde{
    position:absolute; right:-4px; bottom:-4px; width:19px; height:19px; border-radius:50%;
    background:#5E8C61; color:#fff; font-size:10px; display:none; align-items:center; justify-content:center;
    border:2px solid #fff;
  }
  .item-cont.visto .tilde{display:flex;}
  .completar-clase{margin-top:26px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .btn-completar{
    font-family:'Jost',sans-serif; font-size:11.5px; font-weight:500;
    text-transform:uppercase; letter-spacing:.16em; cursor:pointer;
    padding:13px 20px; border-radius:2px; border:1px solid #5E8C61; color:#5E8C61; background:#fff;
    transition:all .25s ease;
  }
  .btn-completar.hecha{background:#5E8C61; color:#fff;}
  .completar-clase small{font-size:12.5px; color:var(--ink-soft);}

  /* ---------- Lista de contenidos de la clase ---------- */
  .contenidos-clase{display:flex; flex-direction:column; gap:12px;}
  .item-cont{
    display:flex; align-items:center; gap:18px; width:100%;
    background:var(--white); border:1px solid var(--line); border-radius:6px;
    padding:18px 22px; text-align:left; cursor:pointer; text-decoration:none;
    font-family:'Jost',sans-serif; color:var(--ink);
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  .item-cont .ico{
    width:46px; height:46px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .item-cont .ico svg{width:24px; height:24px;}
  .ico-pdf{background:#E3F2E1; color:#3F6B45;}
  .ico-video{background:#E1ECF8; color:#36557A;}
  .item-cont .txt{flex:1; min-width:0;}
  .item-cont .txt strong{display:block; font-weight:500; font-size:15px; letter-spacing:.03em; text-transform:uppercase; line-height:1.35;}
  .item-cont .txt small{display:block; margin-top:3px; font-size:13px; color:var(--ink-soft);}
  .item-cont .accion{
    flex-shrink:0; font-size:10.5px; font-weight:500; text-transform:uppercase; letter-spacing:.16em;
    color:var(--rose-deep); white-space:nowrap;
  }
  .item-cont.abierto{border-color:var(--rose); background:#FFFBFA; box-shadow:0 10px 30px -18px rgba(201,143,138,.5);}
  .item-cont.abierto .ico-video{background:var(--rose-deep); color:var(--white);}
  .player-cont{display:none; margin-top:-4px;}
  .player-cont.abierto{display:block; animation:aparecer .3s ease;}
  @media (max-width:640px){
    .item-cont{padding:14px 16px; gap:14px;}
    .item-cont .ico{width:40px; height:40px;}
    .item-cont .accion{display:none;}
  }
  .sin-contenido{color:var(--ink-soft); font-style:italic; font-size:14.5px; padding:30px 0;}
  .nav-clases{display:flex; justify-content:space-between; gap:12px; margin-top:34px; padding-top:22px; border-top:1px solid var(--line);}
  .btn-nav{
    font-family:'Jost',sans-serif; font-size:11px; font-weight:500;
    text-transform:uppercase; letter-spacing:.18em; cursor:pointer;
    background:transparent; color:var(--ink); border:1px solid var(--ink);
    padding:13px 20px; border-radius:2px; transition:all .25s ease;
  }
  .btn-nav.primario{background:var(--ink); color:var(--white);}
  .btn-nav:disabled{visibility:hidden;}

  @media (max-width:900px){
    .layout-curso{grid-template-columns:1fr; gap:28px;}
    .zona-clase{order:-1;}
    .lista-clases{position:static; max-height:none;}
    .barra-avance{width:140px;}
  }
  @media (max-width:640px){
    .curso-top{align-items:flex-start;}
    .btn-nav{padding:12px 14px; letter-spacing:.12em;}
  }

  .btn-login:disabled{opacity:.6; cursor:wait;}

  /* ---------- EXAMEN FINAL ---------- */
  .tarjeta-examen{
    margin-top:40px; background:var(--white); border:1px solid var(--line); border-radius:6px;
    padding:26px 28px; display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap;
  }
  .tarjeta-examen .ico-ex{
    width:52px; height:52px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; background:var(--rose-soft); color:var(--rose-deep);
  }
  .tarjeta-examen .ico-ex svg{width:26px; height:26px;}
  .tarjeta-examen.bloqueada .ico-ex{background:var(--paper); color:var(--ink-soft);}
  .tarjeta-examen.aprobada{border-color:#BFD6BD; background:linear-gradient(135deg,#FFFFFF 0%,#EEF5EE 100%);}
  .tarjeta-examen.aprobada .ico-ex{background:#5E8C61; color:#fff;}
  .tarjeta-examen .cuerpo-ex{flex:1; min-width:220px;}
  .tarjeta-examen .eyebrow-clase{display:block; margin-bottom:4px;}
  .tarjeta-examen h3{font-size:26px; line-height:1.15; color:var(--ink); margin-bottom:6px;}
  .tarjeta-examen p{font-size:14.5px; color:var(--ink-soft);}
  .datos-ex{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 0;}
  .datos-ex span{font-size:12.5px; background:var(--paper); border:1px solid var(--line); padding:4px 10px; border-radius:999px; color:var(--ink);}
  .acciones-ex{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; align-items:center;}
  .confirmar-ex{margin-top:18px; padding:16px 18px; border-radius:4px; background:#FFFBFA; border:1px solid var(--rose); font-size:14.5px;}
  .confirmar-ex strong{font-weight:500;}
  .msg-ex{margin-top:12px; font-size:14px; color:var(--error);}
  .msg-ex:empty{display:none;}
  .btn-ex{
    font-family:'Jost',sans-serif; font-size:11.5px; font-weight:500;
    text-transform:uppercase; letter-spacing:.16em; cursor:pointer; min-height:46px;
    padding:13px 22px; border-radius:2px; border:1px solid var(--ink); background:var(--ink); color:var(--white);
    transition:background .2s, border-color .2s, transform .15s;
  }
  .btn-ex:active{transform:scale(.97);}
  .btn-ex.sec{background:transparent; color:var(--ink);}
  .btn-ex:disabled{opacity:.55; cursor:wait;}
  .chip-ex{color:#3F6B45 !important; font-weight:500;}

  .vista-examen{max-width:760px; margin:0 auto;}
  .vista-examen .curso-top{align-items:flex-start;}
  .barra-examen{
    position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; gap:12px;
    background:rgba(253,251,249,.94); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line); padding:12px 0; margin-bottom:22px;
  }
  .barra-examen .progreso-ex{font-size:12px; text-transform:uppercase; letter-spacing:.16em; color:var(--ink-soft);}
  .reloj{font-variant-numeric:tabular-nums; font-weight:500; font-size:15px; padding:6px 14px; border-radius:999px; background:var(--paper); border:1px solid var(--line);}
  .reloj.urgente{background:#FBEFED; border-color:#F0D5D0; color:#A8473A;}
  .instrucciones-ex{background:var(--white); border:1px solid var(--line); border-radius:4px; padding:14px 18px; margin-bottom:22px; font-size:14.5px; white-space:pre-wrap;}
  .preg-ex{border:1px solid var(--line); background:var(--white); border-radius:6px; padding:22px 22px 16px; margin:0 0 16px;}
  .preg-ex legend{display:contents;}
  .preg-ex .n{display:block; font-size:10.5px; font-weight:500; text-transform:uppercase; letter-spacing:.24em; color:var(--rose-deep); margin-bottom:6px;}
  .preg-ex .t{display:block; font-size:16.5px; font-weight:400; line-height:1.5; margin-bottom:14px; white-space:pre-wrap;}
  .op-ex{
    display:flex; align-items:center; gap:14px; min-height:48px; cursor:pointer;
    padding:10px 14px; margin-bottom:8px; border:1px solid var(--line); border-radius:6px; font-size:15px;
    transition:border-color .15s, background .15s;
  }
  .op-ex input{position:absolute; opacity:0; pointer-events:none;}
  .op-ex .letra{
    width:30px; height:30px; flex-shrink:0; border-radius:50%; border:1.5px solid #DCCFC8;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:500; color:var(--ink-soft);
    transition:all .15s;
  }
  .op-ex.elegida{border-color:var(--rose-deep); background:#FFF8F6;}
  .op-ex input:checked + .letra{background:var(--rose-deep); border-color:var(--rose-deep); color:#fff;}
  .op-ex input:focus-visible + .letra{outline:2px solid var(--rose-deep); outline-offset:3px;}
  .enviar-ex{margin:28px 0 10px; padding-top:22px; border-top:1px solid var(--line);}
  .resultado-ex{text-align:center; padding:56px 20px 30px; max-width:520px; margin:0 auto;}
  .resultado-ex .ico-ex{width:76px; height:76px; margin:0 auto 20px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  .resultado-ex .ico-ex svg{width:36px; height:36px;}
  .resultado-ex.ok .ico-ex{background:#5E8C61; color:#fff;}
  .resultado-ex.no .ico-ex{background:var(--rose-soft); color:var(--rose-deep);}
  .resultado-ex h2{font-size:clamp(30px,4vw,40px); margin-bottom:10px;}
  .resultado-ex p{color:var(--ink-soft); font-size:15.5px;}
  .resultado-ex .acciones-ex{justify-content:center; margin-top:28px;}
  @media (max-width:640px){
    .tarjeta-examen{padding:22px 20px;}
    .preg-ex{padding:18px 16px 12px;}
  }
  @media (hover:hover) and (pointer:fine){
    .btn-ex:hover{background:var(--rose-deep); border-color:var(--rose-deep); color:var(--white);}
    .op-ex:hover{border-color:var(--rose);}
  }
  @media (prefers-reduced-motion:reduce){ .btn-ex:active{transform:none;} }

  /* ---------- ESQUELETOS DE CARGA ---------- */
  .skeleton-card{background:var(--white); border:1px solid var(--line); border-radius:2px; overflow:hidden;}
  .skeleton-img, .skeleton-line{
    background:linear-gradient(90deg, #F1ECE7 25%, #E8E0D8 50%, #F1ECE7 75%);
    background-size:200% 100%; animation:shimmer 1.5s infinite linear;
  }
  .skeleton-img{width:100%; aspect-ratio:16/10;}
  .skeleton-body{padding:26px 24px 22px; display:flex; flex-direction:column; gap:12px;}
  .skeleton-line{height:14px; border-radius:2px;}
  .skeleton-line.titulo{height:26px; width:75%;}
  .skeleton-line.corta{width:60%;}
  @keyframes shimmer{0%{background-position:200% 0;} 100%{background-position:-200% 0;}}

  #vacio, #error{
    text-align:center; padding:80px 20px;
    color:var(--ink-soft); font-size:15px; font-style:italic;
  }
  #error{color:var(--error);}

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:640px){
    header{flex-direction:column; align-items:flex-start; padding:36px 0 28px;}
    .saludo{text-align:left;}
    .brand img{width:52px;}
    .login-box{padding:40px 28px;}
    .login-logo{width:180px;}
    .grid{grid-template-columns:1fr; gap:24px;}
  }

  /* Botones: sin doble toque en celulares */
  button, a{touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
  /* Efectos al pasar el mouse: solo en computadoras con mouse */
  @media (hover:hover) and (pointer:fine){
    .btn-login:hover{background:var(--rose-deep);}
    .btn-salir:hover{border-bottom-color:var(--rose-deep);}
    .curso:hover{transform:translateY(-4px); box-shadow:0 24px 48px -24px rgba(201,143,138,.28);}
    .curso:hover::before{transform:scaleX(1);}
    .btn-ver:hover{background:var(--ink); color:var(--white);}
    .lista-pdf a:hover{border-color:var(--rose); background:var(--rose-soft);}
    .btn-volver:hover{border-bottom-color:var(--rose-deep);}
    .item-clase:not(.activa):hover{background:var(--paper);}
    .btn-completar:not(.hecha):hover{background:#EEF5EE;}
    .item-cont:not(.abierto):hover{border-color:var(--rose); box-shadow:0 10px 30px -20px rgba(201,143,138,.45);}
    .btn-nav:hover{background:var(--rose-deep); border-color:var(--rose-deep); color:var(--white);}
    .btn-cert:hover{background:var(--rose-deep); border-color:var(--rose-deep); color:var(--white);}
    .link-cert:hover{border-bottom-color:var(--rose-deep);}
  }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen">
  <div class="login-box">
    <img class="login-logo" src="logo-completo.png" alt="Instituto Mariana Barrera">
    <h1>Mariana Barrera</h1>
    <div class="sub">Aula Virtual</div>
    <input id="login-email" type="email" placeholder="Email" autocomplete="username" autocapitalize="off">
    <input id="login-pass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <div class="login-error" id="login-error"></div>
    <button class="btn-login" id="btn-login" onclick="doLogin()">Ingresar</button>
  </div>
</div>

<!-- ===================== CLASSROOM ===================== -->
<div id="app" style="display:none">
  <header class="wrap">
    <div class="brand">
      <img src="logo-loto.png" alt="Instituto Mariana Barrera">
      <div class="brand-text">
        <div class="eyebrow">Aula Virtual</div>
        <h1>Mariana Barrera</h1>
        <div class="sub">Instituto de Estética &amp; Cosmiatría</div>
      </div>
    </div>
    <div class="saludo">
      <div>Bienvenida</div>
      <strong id="saludo-nombre"></strong>
      <button class="btn-salir" onclick="logout()">Cerrar sesión</button>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div id="vista-cursos">
        <div class="seccion-titulo">
          <h2>Mis cursos</h2>
          <button class="link-cert" id="link-cert" style="display:none;" onclick="irACertificados()"></button>
        </div>
        <div id="estado" style="display:none;"></div>
        <div id="grid" class="grid"></div>
        <div id="vacio" style="display:none;">Todavía no tenés cursos habilitados. Consultá con el instituto.</div>
        <div id="error" style="display:none;"></div>

        <section id="mis-certificados" style="display:none;">
          <div class="seccion-titulo">
            <div>
              <h2>Mis certificados</h2>
              <p>Tus diplomas y certificados emitidos por el instituto.</p>
            </div>
          </div>
          <div id="lista-certificados" class="grid-cert"></div>
        </section>
      </div>
      <div id="vista-curso"></div>
    </div>
  </main>
</div>

<script>
  // URL del Apps Script del CLASSROOM (no cambia: se publica como "nueva versión" de la misma implementación)
  const API_URL = 'https://script.google.com/macros/s/AKfycbyNPTjRExPbY9QfSG_eyp2qndNdqYsmhJe64CzEOSnJPOUba6sGeJXsZEwW805z2F-j/exec';

  const gridEl = document.getElementById('grid');
  const estadoEl = document.getElementById('estado');
  const vacioEl = document.getElementById('vacio');
  const errorEl = document.getElementById('error');

  // Borra la sesión de la versión anterior, que guardaba datos personales
  sessionStorage.removeItem('alumno');

  /* ---------- Helpers de seguridad ---------- */

  // Escapa texto antes de meterlo en el HTML
  function esc(v) {
    return (v === undefined || v === null) ? '' :
      String(v).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  // Solo acepta links que empiecen con https:// (bloquea javascript: y similares)
  function urlSegura(v) {
    const s = String(v || '').trim();
    return /^https:\/\//i.test(s) ? s : '';
  }

  // Solo acepta IDs de YouTube válidos (letras, números, - y _)
  function idYoutubeSeguro(v) {
    const s = String(v || '').trim();
    return /^[A-Za-z0-9_-]{6,20}$/.test(s) ? s : '';
  }

  /* ---------- API ---------- */

  async function api(action, payload) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload })
    });
    return res.json();
  }

  /* ---------- Login / sesión ---------- */

  async function doLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-pass').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';
    if (!email || !password) { errEl.textContent = 'Completá email y contraseña.'; return; }
    const btn = document.getElementById('btn-login');
    btn.disabled = true; btn.textContent = 'Ingresando…';
    try {
      const result = await api('loginAlumno', { email, password });
      if (result.success && result.token) {
        // Solo se guarda el token y el nombre para el saludo
        sessionStorage.setItem('alumno_token', result.token);
        sessionStorage.setItem('alumno_nombre', (result.alumno && result.alumno.Nombre) || '');
        mostrarApp(result);
      } else if (result.bloqueado) {
        errEl.textContent = 'Demasiados intentos fallidos. Esperá 10 minutos y volvé a probar.';
      } else {
        errEl.textContent = 'Email o contraseña incorrectos.';
      }
    } catch (e) {
      errEl.textContent = 'No se pudo conectar con el servidor.';
    } finally {
      btn.disabled = false; btn.textContent = 'Ingresar';
    }
  }

  // Ingresar apretando Enter
  ['login-email', 'login-pass'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  });

  function logout() {
    sessionStorage.removeItem('alumno_token');
    sessionStorage.removeItem('alumno_nombre');
    location.reload();
  }

  function mostrarApp(datos) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('saludo-nombre').textContent = sessionStorage.getItem('alumno_nombre') || '';
    // Si el login ya trajo los cursos, se muestran sin otra llamada al servidor
    if (datos && Array.isArray(datos.cursos)) renderCursos(datos.cursos, datos.certificados || [], datos.avance || {});
    else cargarCursos();
  }

  function mostrarSkeletons(cantidad) {
    gridEl.innerHTML = '';
    for (let i = 0; i < cantidad; i++) {
      const sk = document.createElement('div');
      sk.className = 'skeleton-card';
      sk.innerHTML = `<div class="skeleton-img"></div>
        <div class="skeleton-body">
          <div class="skeleton-line titulo"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line corta"></div>
        </div>`;
      gridEl.appendChild(sk);
    }
  }

  function renderCursos(cursos, certificados, avance) {
    CURSOS = cursos;
    AVANCE = avance || {};
    renderCertificados(certificados || []);
    gridEl.innerHTML = '';
    estadoEl.style.display = 'none';
    if (!cursos.length) { vacioEl.style.display = 'block'; return; }
    cursos.forEach(curso => gridEl.appendChild(crearTarjeta(curso)));
    aplicarRuta();
  }

  /* ---------- Mis certificados ---------- */

  let CERTIFICADOS = [];

  const ICONO_SELLO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="9" r="6"/><path d="M9 14.2 7.5 22l4.5-2.5 4.5 2.5-1.5-7.8"/><path d="m9.7 9 1.6 1.6 3-3.2"/></svg>`;

  function normalizar(t) {
    return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
  }

  // Link de descarga directa de Drive (si el link es de Drive)
  function linkDescarga(url) {
    const m = String(url).match(/\/d\/([A-Za-z0-9_-]+)/) || String(url).match(/[?&]id=([A-Za-z0-9_-]+)/);
    return m ? 'https://drive.google.com/uc?export=download&id=' + m[1] : '';
  }

  function botonesCertificado(c, textoDescarga) {
    const ver = urlSegura(c.URL_PDF);
    if (!ver) return '';
    const bajar = linkDescarga(ver);
    return `<a class="btn-cert" href="${esc(ver)}" target="_blank" rel="noopener">Ver</a>
      ${bajar ? `<a class="btn-cert primario" href="${esc(bajar)}">${textoDescarga}</a>` : ''}`;
  }

  function renderCertificados(certificados) {
    CERTIFICADOS = certificados.filter(c => urlSegura(c.URL_PDF));
    const seccion = document.getElementById('mis-certificados');
    const link = document.getElementById('link-cert');
    if (!CERTIFICADOS.length) { seccion.style.display = 'none'; link.style.display = 'none'; return; }

    document.getElementById('lista-certificados').innerHTML = CERTIFICADOS.map(c => `
      <div class="cert">
        <div class="sello">${ICONO_SELLO}</div>
        <div class="cert-info">
          <div class="eyebrow">${esc(c.Tipo || 'Diploma')}</div>
          <h4>${esc(c.Curso)}</h4>
          <div class="cert-meta">${[c.Fecha, c.Certificado].filter(Boolean).map(esc).join(' · ')}</div>
          <div class="cert-acciones">${botonesCertificado(c, 'Descargar PDF')}</div>
        </div>
      </div>`).join('');
    seccion.style.display = 'block';
    link.textContent = `Mis certificados (${CERTIFICADOS.length}) ↓`;
    link.style.display = 'inline-block';
  }

  function irACertificados() {
    document.getElementById('mis-certificados').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function certificadoDelCurso(curso) {
    const nombre = normalizar(curso.Nombre);
    return CERTIFICADOS.find(c => normalizar(c.Curso) === nombre) || null;
  }

  async function cargarCursos() {
    mostrarSkeletons(3);
    try {
      const data = await api('getCursosAlumno', { token: sessionStorage.getItem('alumno_token') });

      // Sesión vencida o inválida: volver al login
      if (data.sesionInvalida) {
        sessionStorage.removeItem('alumno_token');
        sessionStorage.removeItem('alumno_nombre');
        document.getElementById('app').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('login-error').textContent = 'Tu sesión venció. Volvé a ingresar.';
        return;
      }
      if (data.error) throw new Error(data.error);

      renderCursos(data.cursos || [], data.certificados || [], data.avance || {});
    } catch (e) {
      gridEl.innerHTML = '';
      errorEl.style.display = 'block';
      errorEl.textContent = 'No se pudieron cargar tus cursos. Intentá de nuevo más tarde.';
    }
  }

  /* ---------- Grilla de cursos ---------- */

  let CURSOS = [];
  let AVANCE = {};   // { ID_Clase: { items: [ID_Material...], completa: true/false } }

  function estadoClase(idClase) {
    const e = AVANCE[String(idClase)];
    return e ? e : { items: [], completa: false };
  }

  function progresoCurso(curso) {
    const clases = curso.Clases || [];
    const hechas = clases.filter(c => estadoClase(c.ID_Clase).completa).length;
    return { hechas, total: clases.length, pct: clases.length ? Math.round(hechas / clases.length * 100) : 0 };
  }

  function contarContenidos(clases) {
    let videos = 0, pdfs = 0;
    (clases || []).forEach(c => (c.Contenidos || []).forEach(x => { if (x.Tipo === 'Video') videos++; else pdfs++; }));
    return { videos, pdfs };
  }

  function crearTarjeta(curso) {
    const card = document.createElement('div');
    card.className = 'curso';
    const img = urlSegura(curso.Imagen_URL);
    const nClases = (curso.Clases || []).length;
    const prog = progresoCurso(curso);
    card.innerHTML = `
      ${img
        ? `<img class="curso-img" src="${esc(img)}" alt="${esc(curso.Nombre)}" loading="lazy">`
        : `<div class="curso-img"></div>`}
      <div class="curso-body">
        <div class="eyebrow">Curso</div>
        <h3>${esc(curso.Nombre) || 'Curso sin nombre'}</h3>
        <p class="desc">${esc(curso.Descripcion_Programa)}</p>
        <div class="meta">
          ${curso.Duracion ? `<span>${esc(curso.Duracion)}</span>` : ''}
          ${nClases ? `<span>${nClases} ${nClases === 1 ? 'clase' : 'clases'}</span>` : ''}
          ${curso.Examen && curso.Examen.Aprobado ? '<span class="chip-ex">✓ Examen aprobado</span>'
            : curso.Examen && (prog.total === 0 || prog.hechas === prog.total) && curso.Examen.Restantes > 0 ? '<span class="chip-ex">Examen final disponible</span>' : ''}
        </div>
        ${nClases ? `<div class="prog-curso">
          <div class="prog-barra"><span style="width:${prog.pct}%"></span></div>
          <small>${prog.pct}% completado · ${prog.hechas} de ${prog.total} ${prog.total === 1 ? 'clase' : 'clases'}</small>
        </div>` : ''}
        <button class="btn-ver">${prog.pct === 100 ? 'Repasar curso' : prog.hechas ? 'Continuar curso' : 'Empezar curso'}</button>
      </div>`;
    const abrir = () => abrirCurso(curso.ID_Curso);
    card.querySelector('.btn-ver').addEventListener('click', abrir);
    const imgEl = card.querySelector('.curso-img');
    imgEl.style.cursor = 'pointer';
    imgEl.addEventListener('click', abrir);
    return card;
  }

  /* ---------- Navegación (el botón "atrás" del celular vuelve a Mis cursos) ---------- */

  const vistaCursosEl = document.getElementById('vista-cursos');
  const vistaCursoEl = document.getElementById('vista-curso');
  let entroDesdeGrilla = false;

  function abrirCurso(idCurso) {
    entroDesdeGrilla = true;
    location.hash = 'curso=' + encodeURIComponent(idCurso);
  }

  function volverACursos() {
    if (entroDesdeGrilla) history.back();
    else location.hash = '';
  }

  function aplicarRuta() {
    const m = location.hash.match(/curso=([^&]+)/);
    const curso = m ? CURSOS.find(c => String(c.ID_Curso) === decodeURIComponent(m[1])) : null;
    if (curso) mostrarCurso(curso);
    else mostrarGrilla();
  }
  window.addEventListener('hashchange', aplicarRuta);

  function mostrarGrilla() {
    detenerSeguimiento();
    detenerExamen();
    vistaCursoEl.innerHTML = '';           // corta cualquier video que esté sonando
    // Redibuja las tarjetas para mostrar el avance actualizado
    if (CURSOS.length) { gridEl.innerHTML = ''; CURSOS.forEach(c => gridEl.appendChild(crearTarjeta(c))); }
    vistaCursoEl.style.display = 'none';
    vistaCursosEl.style.display = 'block';
    cursoActual = null;
  }

  /* ---------- Vista del curso ---------- */

  let cursoActual = null;
  let claseIdx = 0;

  // Recuerda la última clase vista de cada curso (solo en este navegador)
  function leerUltimaClase(idCurso) {
    try { return localStorage.getItem('aula_ultima_' + idCurso); } catch (e) { return null; }
  }
  function guardarUltimaClase(idCurso, idClase) {
    try { localStorage.setItem('aula_ultima_' + idCurso, String(idClase)); } catch (e) {}
  }

  function numeroClase(clase, i) {
    return String(clase.Orden || (i + 1)).padStart(2, '0');
  }

  function mostrarCurso(curso) {
    detenerExamen();
    cursoActual = curso;
    const clases = curso.Clases || [];
    vistaCursosEl.style.display = 'none';
    vistaCursoEl.style.display = 'block';

    vistaCursoEl.innerHTML = `
      <div class="curso-top">
        <div>
          <button class="btn-volver" data-accion="volver">← Mis cursos</button>
          <h2>${esc(curso.Nombre)}</h2>
        </div>
        ${clases.length ? `<div>
          <div class="avance" id="avance"></div>
          <div class="barra-avance"><span id="barra-avance"></span></div>
        </div>` : ''}
      </div>
      ${(() => {
        const cert = certificadoDelCurso(curso);
        return cert ? `
        <div class="banner-cert">
          <div class="sello">${ICONO_SELLO}</div>
          <div class="texto">
            <strong>¡Completaste este curso!</strong>
            <span>Tu ${esc(String(cert.Tipo || 'diploma').toLowerCase())} ya está disponible para descargar.</span>
          </div>
          <div class="cert-acciones" style="margin-top:0;">${botonesCertificado(cert, 'Descargar')}</div>
        </div>` : '';
      })()}
      ${curso.Descripcion_Larga ? `
        <details class="sobre-curso">
          <summary>Sobre este curso</summary>
          <div class="desc-larga">${esc(curso.Descripcion_Larga)}</div>
        </details>` : ''}
      ${clases.length ? `
        <div class="layout-curso">
          <aside class="lista-clases">
            <div class="titulo-lista">Clases del curso</div>
            ${clases.map((c, i) => {
              const n = contarContenidos([c]);
              const partes = [];
              if (n.videos) partes.push(n.videos + (n.videos === 1 ? ' video' : ' videos'));
              if (n.pdfs) partes.push(n.pdfs + ' PDF');
              return `<button class="item-clase${estadoClase(c.ID_Clase).completa ? ' hecha' : ''}" data-clase="${i}">
                <span class="num">${esc(numeroClase(c, i))}</span>
                <span class="txt"><strong>${esc(c.Titulo)}</strong><small>${partes.join(' · ') || 'Sin contenidos aún'}</small></span>
                <span class="check" title="Clase completada">✓</span>
              </button>`;
            }).join('')}
          </aside>
          <section class="zona-clase" id="zona-clase"></section>
        </div>`
      : '<p class="sin-contenido">Todavía no hay clases cargadas para este curso.</p>'}
      <div id="zona-examen"></div>
    `;
    window.scrollTo(0, 0);
    renderTarjetaExamen();

    if (clases.length) {
      const ultima = leerUltimaClase(curso.ID_Curso);
      const i = clases.findIndex(c => String(c.ID_Clase) === ultima);
      seleccionarClase(i >= 0 ? i : 0, false);
    }
  }

  function seleccionarClase(i, desplazar) {
    const clases = cursoActual.Clases || [];
    if (i < 0 || i >= clases.length) return;
    detenerSeguimiento();
    claseIdx = i;
    const clase = clases[i];
    guardarUltimaClase(cursoActual.ID_Curso, clase.ID_Clase);
    const estado = estadoClase(clase.ID_Clase);

    vistaCursoEl.querySelectorAll('.item-clase').forEach((el, j) => el.classList.toggle('activa', j === i));

    // Los contenidos se muestran EXACTAMENTE en el orden cargado en el panel
    const contenidos = (clase.Contenidos || []).filter(x =>
      x.Tipo === 'Video' ? idYoutubeSeguro(x.Link) : urlSegura(x.Link));
    const esUltima = i === clases.length - 1;

    const ICO_PDF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>';
    const ICO_VIDEO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m10 8.5 5 3.5-5 3.5z" fill="currentColor"/></svg>';

    const html = contenidos.map(x => {
      if (x.Tipo === 'Video') {
        const id = idYoutubeSeguro(x.Link);
        const nombre = x.Nombre || 'Video';
        const visto = estado.items.indexOf(String(x.ID)) !== -1;
        return `<div>
          <button class="item-cont${visto ? ' visto' : ''}" data-video="${id}" data-nombre="${esc(nombre)}" data-item="${esc(x.ID)}">
            <span class="ico ico-video">${ICO_VIDEO}<span class="tilde">✓</span></span>
            <span class="txt"><strong>${esc(nombre)}</strong><small>Video · Tocá para reproducir</small></span>
            <span class="accion">▶ Ver</span>
          </button>
          <div class="player-cont"></div>
        </div>`;
      }
      const visto = estado.items.indexOf(String(x.ID)) !== -1;
      return `<a class="item-cont${visto ? ' visto' : ''}" href="${esc(urlSegura(x.Link))}" target="_blank" rel="noopener" data-item="${esc(x.ID)}">
          <span class="ico ico-pdf">${ICO_PDF}<span class="tilde">✓</span></span>
          <span class="txt"><strong>${esc(x.Nombre || 'Material PDF')}</strong><small>Documento PDF · Se abre en otra pestaña</small></span>
          <span class="accion">Abrir ↗</span>
        </a>`;
    }).join('');

    const zona = document.getElementById('zona-clase');
    zona.innerHTML = `
      <div class="eyebrow-clase">Clase ${esc(numeroClase(clase, i))}</div>
      <h3>${esc(clase.Titulo)}</h3>
      ${html ? `<div class="contenidos-clase">${html}</div>` : '<p class="sin-contenido">Esta clase todavía no tiene contenidos.</p>'}
      <div class="completar-clase">
        <button class="btn-completar" id="btn-completar" data-accion="completar"></button>
        <small id="ayuda-completar"></small>
      </div>
      <div class="nav-clases">
        <button class="btn-nav" data-accion="anterior" ${i === 0 ? 'disabled' : ''}>← Anterior</button>
        <button class="btn-nav primario" data-accion="siguiente" ${esUltima ? 'disabled' : ''}>Siguiente clase →</button>
      </div>`;

    actualizarAvanceUI();
    if (desplazar) zona.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ---------- Avance: actualizar pantalla y avisar al servidor ---------- */

  function claseActual() {
    return cursoActual ? (cursoActual.Clases || [])[claseIdx] : null;
  }

  function actualizarAvanceUI() {
    if (!cursoActual) return;
    const clases = cursoActual.Clases || [];
    const prog = progresoCurso(cursoActual);
    const av = document.getElementById('avance');
    if (av) av.textContent = `${prog.hechas} de ${prog.total} ${prog.total === 1 ? 'clase completada' : 'clases completadas'} · ${prog.pct}%`;
    const barra = document.getElementById('barra-avance');
    if (barra) barra.style.width = prog.pct + '%';
    vistaCursoEl.querySelectorAll('.item-clase').forEach((el, j) =>
      el.classList.toggle('hecha', !!(clases[j] && estadoClase(clases[j].ID_Clase).completa)));

    renderTarjetaExamen();
    const clase = claseActual();
    if (!clase) return;
    const estado = estadoClase(clase.ID_Clase);
    vistaCursoEl.querySelectorAll('.item-cont[data-item]').forEach(el =>
      el.classList.toggle('visto', estado.items.indexOf(el.dataset.item) !== -1));
    const btn = document.getElementById('btn-completar');
    const ayuda = document.getElementById('ayuda-completar');
    if (btn) {
      btn.classList.toggle('hecha', estado.completa);
      btn.textContent = estado.completa ? '✓ Clase completada' : 'Marcar clase como completada';
      ayuda.textContent = estado.completa
        ? 'Tocá de nuevo si querés desmarcarla.'
        : 'Se marca sola cuando abrís todos los PDF y ves los videos completos.';
    }
  }

  function guardarEstado(idClase, estado) {
    AVANCE[String(idClase)] = { items: estado.items || [], completa: !!estado.completa };
  }

  async function enviarAvance(datos) {
    try {
      const r = await api('marcarAvance', Object.assign({ token: sessionStorage.getItem('alumno_token') }, datos));
      if (r && r.ok) { guardarEstado(r.idClase, r); actualizarAvanceUI(); }
    } catch (e) { /* si falla, se reintenta la próxima vez que vea el contenido */ }
  }

  // Un contenido se vio (PDF abierto o video casi terminado)
  function registrarItem(idClase, idItem) {
    if (!idClase || !idItem) return;
    const est = estadoClase(idClase);
    if (est.items.indexOf(String(idItem)) !== -1) return;
    const items = est.items.concat(String(idItem));
    // Anticipa en pantalla si con esto completó la clase
    const clase = (cursoActual && (cursoActual.Clases || []).find(c => String(c.ID_Clase) === String(idClase))) || null;
    const todos = clase ? (clase.Contenidos || []).map(c => String(c.ID)).filter(Boolean) : [];
    const completa = est.completa || (todos.length > 0 && todos.every(id => items.indexOf(id) !== -1));
    guardarEstado(idClase, { items, completa });
    actualizarAvanceUI();
    enviarAvance({ idClase: String(idClase), idItem: String(idItem) });
  }

  function alternarCompletada() {
    const clase = claseActual();
    if (!clase) return;
    const est = estadoClase(clase.ID_Clase);
    guardarEstado(clase.ID_Clase, { items: est.items, completa: !est.completa });
    actualizarAvanceUI();
    enviarAvance({ idClase: String(clase.ID_Clase), completar: !est.completa });
  }

  /* ---------- Seguimiento del video (API de YouTube) ---------- */

  let ytPromesa = null;
  function cargarYT() {
    if (window.YT && window.YT.Player) return Promise.resolve();
    if (ytPromesa) return ytPromesa;
    ytPromesa = new Promise((resolve, reject) => {
      const previo = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (previo) previo(); resolve(); };
      const s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      s.onerror = () => { ytPromesa = null; reject(new Error('YouTube no disponible')); };
      document.head.appendChild(s);
      setTimeout(() => reject(new Error('YouTube tardó demasiado')), 8000);
    });
    return ytPromesa;
  }

  let seguimiento = null;   // { player, intervalo }
  function detenerSeguimiento() {
    if (!seguimiento) return;
    clearInterval(seguimiento.intervalo);
    try { seguimiento.player && seguimiento.player.destroy && seguimiento.player.destroy(); } catch (e) {}
    seguimiento = null;
  }

  function seguirVideo(contenedor, idVideo, nombre, idClase, idItem) {
    contenedor.innerHTML = '<div class="reproductor"><div></div></div>';
    const destino = contenedor.querySelector('.reproductor > div');
    const fallback = () => { contenedor.innerHTML = `<div class="reproductor">${iframeVideo(idVideo, nombre, true)}</div>`; };
    cargarYT().then(() => {
      if (!destino.isConnected) return;            // el alumno ya cerró el video
      let marcado = false;
      const marcar = () => { if (!marcado) { marcado = true; registrarItem(idClase, idItem); } };
      const player = new YT.Player(destino, {
        videoId: idVideo,
        host: 'https://www.youtube-nocookie.com',
        playerVars: { rel: 0, modestbranding: 1, playsinline: 1, autoplay: 1, origin: location.origin },
        events: { onStateChange: ev => { if (ev.data === YT.PlayerState.ENDED) marcar(); } }
      });
      const intervalo = setInterval(() => {
        try {
          const d = player.getDuration(), t = player.getCurrentTime();
          if (d > 0 && t / d >= 0.9) marcar();       // visto al 90%
        } catch (e) {}
      }, 3000);
      seguimiento = { player, intervalo };
    }).catch(fallback);
  }

  // Abre el video debajo de su tarjeta y lo reproduce; cierra (y frena) el que estuviera abierto
  function abrirVideo(boton) {
    const player = boton.nextElementSibling;
    const yaAbierto = boton.classList.contains('abierto');
    detenerSeguimiento();
    vistaCursoEl.querySelectorAll('.item-cont.abierto').forEach(b => {
      b.classList.remove('abierto');
      b.querySelector('small').textContent = 'Video · Tocá para reproducir';
      b.querySelector('.accion').textContent = '▶ Ver';
      const p = b.nextElementSibling;
      p.classList.remove('abierto');
      p.innerHTML = '';
    });
    if (yaAbierto) return;
    boton.classList.add('abierto');
    boton.querySelector('small').textContent = 'Video · Reproduciendo';
    boton.querySelector('.accion').textContent = '✕ Cerrar';
    const clase = claseActual();
    seguirVideo(player, boton.dataset.video, boton.dataset.nombre || 'Video', clase && clase.ID_Clase, boton.dataset.item);
    player.classList.add('abierto');
    boton.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function iframeVideo(id, nombre, autoplay) {
    return `<iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1&playsinline=1${autoplay ? '&autoplay=1' : ''}"
      title="${esc(nombre)}" referrerpolicy="strict-origin-when-cross-origin"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
      allowfullscreen></iframe>`;
  }

  /* ---------- Examen final ---------- */

  const ICO_EXAMEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6M9 4a1 1 0 0 0-1 1v1h8V5a1 1 0 0 0-1-1M8 5H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2"/><path d="m9 13 2 2 4-4"/></svg>';
  const ICO_CANDADO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  const ICO_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  const ICO_REPASO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>';

  let EXAMEN = null;          // examen en curso: { curso, datos, respuestas, reloj, fin, enviando }
  let pidiendoConfirmacion = false;

  function plural(n, uno, varios) { return n + ' ' + (n === 1 ? uno : varios); }

  function detenerExamen() {
    if (EXAMEN && EXAMEN.reloj) clearInterval(EXAMEN.reloj);
    EXAMEN = null;
    pidiendoConfirmacion = false;
  }

  function renderTarjetaExamen(mensaje) {
    const zona = document.getElementById('zona-examen');
    if (!zona || !cursoActual) return;
    const ex = cursoActual.Examen;
    if (!ex) { zona.innerHTML = ''; return; }
    const prog = progresoCurso(cursoActual);
    const completo = prog.total === 0 || prog.hechas === prog.total;
    const datos = `<div class="datos-ex">
        <span>${plural(ex.Preguntas, 'pregunta', 'preguntas')}</span>
        <span>${ex.Tiempo_Min ? ex.Tiempo_Min + ' minutos' : 'Sin límite de tiempo'}</span>
        <span>Se aprueba con ${esc(ex.Nota_Minima)}%</span>
      </div>`;
    let clase = '', ico = ICO_EXAMEN, titulo = esc(ex.Titulo), texto = '', acciones = '';

    if (ex.Aprobado) {
      clase = 'aprobada'; ico = ICO_OK; titulo = 'Examen aprobado';
      texto = '¡Felicitaciones! Aprobaste el examen final de este curso. Tu resultado quedó registrado en el instituto.';
    } else if (ex.EnCurso) {
      texto = 'Tenés el examen empezado.' + (ex.Tiempo_Min ? ' El tiempo sigue corriendo.' : '');
      acciones = '<button class="btn-ex" data-accion="empezar-examen">Continuar examen</button>';
    } else if (!completo) {
      clase = 'bloqueada'; ico = ICO_CANDADO;
      const faltan = prog.total - prog.hechas;
      texto = `Se habilita cuando completes todas las clases del curso. Te ${faltan === 1 ? 'falta 1 clase' : 'faltan ' + faltan + ' clases'}.`;
    } else if (ex.Restantes <= 0) {
      clase = 'bloqueada'; titulo = 'No aprobaste el examen';
      texto = `Ya usaste ${ex.Intentos_Total === 1 ? 'tu intento' : 'tus ' + ex.Intentos_Total + ' intentos'}. Comunicate con el instituto para ver cómo seguir.`;
    } else {
      texto = ex.Rendido
        ? `No aprobaste el intento anterior. Repasá las clases y volvé a intentarlo: te ${ex.Restantes === 1 ? 'queda 1 intento' : 'quedan ' + ex.Restantes + ' intentos'}.`
        : `Completaste todas las clases. Ya podés rendir el examen final: tenés ${plural(ex.Restantes, 'intento', 'intentos')}.`;
      acciones = pidiendoConfirmacion
        ? `<div class="confirmar-ex" role="group" aria-label="Confirmar inicio del examen">
            <strong>¿Empezamos?</strong> Vas a usar 1 de tus ${plural(ex.Restantes, 'intento restante', 'intentos restantes')}.
            ${ex.Tiempo_Min ? `Tenés ${ex.Tiempo_Min} minutos desde que empezás; al terminar el tiempo se envía solo.` : 'No tiene límite de tiempo.'}
            <div class="acciones-ex">
              <button class="btn-ex" data-accion="empezar-examen">Empezar ahora</button>
              <button class="btn-ex sec" data-accion="cancelar-examen">Todavía no</button>
            </div>
          </div>`
        : '<button class="btn-ex" data-accion="rendir-examen">Rendir examen</button>';
    }
    zona.innerHTML = `<section class="tarjeta-examen ${clase}" aria-labelledby="titulo-ex">
        <div class="ico-ex">${ico}</div>
        <div class="cuerpo-ex">
          <span class="eyebrow-clase">Cierre del curso</span>
          <h3 id="titulo-ex">${titulo}</h3>
          <p>${texto}</p>
          ${!ex.Aprobado && ex.Restantes > 0 ? datos : ''}
          ${acciones ? `<div class="acciones-ex">${acciones}</div>` : ''}
          <div class="msg-ex" id="msg-ex" role="alert">${esc(mensaje || '')}</div>
        </div>
      </section>`;
  }

  function sesionVencidaAula() {
    sessionStorage.removeItem('alumno_token');
    sessionStorage.removeItem('alumno_nombre');
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('login-error').textContent = 'Tu sesión venció. Volvé a ingresar.';
  }

  async function empezarExamen(boton) {
    const curso = cursoActual;
    if (!curso || !curso.Examen) return;
    boton.disabled = true; boton.textContent = 'Preparando…';
    try {
      const r = await api('iniciarExamen', { token: sessionStorage.getItem('alumno_token'), idCurso: curso.ID_Curso });
      if (r.sesionInvalida) { sesionVencidaAula(); return; }
      if (r.error || !r.ok) throw new Error(r.error || 'No se pudo abrir el examen.');
      pidiendoConfirmacion = false;
      curso.Examen.EnCurso = true;
      mostrarExamen(curso, r);
    } catch (e) {
      pidiendoConfirmacion = false;
      renderTarjetaExamen(e instanceof TypeError ? 'No hay conexión. Revisá tu internet y probá de nuevo.' : e.message);
    }
  }

  function claveRespuestas(idIntento) { return 'aula_examen_' + idIntento; }
  function leerRespuestas(idIntento) {
    try { return JSON.parse(localStorage.getItem(claveRespuestas(idIntento)) || '{}') || {}; } catch (e) { return {}; }
  }
  function guardarRespuestas() {
    if (!EXAMEN) return;
    try { localStorage.setItem(claveRespuestas(EXAMEN.datos.idIntento), JSON.stringify(EXAMEN.respuestas)); } catch (e) {}
  }

  function mostrarExamen(curso, datos) {
    detenerSeguimiento();
    detenerExamen();
    EXAMEN = { curso, datos, respuestas: leerRespuestas(datos.idIntento), reloj: null, fin: null, enviando: false };
    const n = datos.preguntas.length;
    vistaCursoEl.innerHTML = `
      <div class="vista-examen">
        <div class="curso-top">
          <div>
            <button class="btn-volver" data-accion="salir-examen">← Volver al curso</button>
            <h2>${esc(datos.titulo || 'Examen final')}</h2>
            <p style="color:var(--ink-soft);font-size:14px;margin-top:4px">${esc(curso.Nombre)} · Intento ${esc(datos.intento)}</p>
          </div>
        </div>
        <div class="barra-examen">
          <span class="progreso-ex" id="progreso-ex" aria-live="polite"></span>
          ${datos.segundosRestantes !== null ? '<span class="reloj" id="reloj-ex" role="timer" aria-label="Tiempo restante"></span>' : ''}
        </div>
        ${datos.instrucciones ? `<div class="instrucciones-ex">${esc(datos.instrucciones)}</div>` : ''}
        <form id="form-examen" onsubmit="return false">
          ${datos.preguntas.map((p, i) => `
            <fieldset class="preg-ex">
              <legend><span class="n">Pregunta ${i + 1} de ${n}</span><span class="t">${esc(p.Pregunta)}</span></legend>
              ${(p.Opciones || []).map(o => `
                <label class="op-ex${EXAMEN.respuestas[p.ID] === o.L ? ' elegida' : ''}">
                  <input type="radio" name="q_${esc(p.ID)}" value="${esc(o.L)}" data-preg="${esc(p.ID)}" ${EXAMEN.respuestas[p.ID] === o.L ? 'checked' : ''}>
                  <span class="letra" aria-hidden="true">${esc(o.L)}</span><span>${esc(o.T)}</span>
                </label>`).join('')}
            </fieldset>`).join('')}
        </form>
        <div class="enviar-ex" id="enviar-ex"></div>
      </div>`;
    window.scrollTo(0, 0);
    actualizarProgresoExamen();
    renderEnvio();
    if (datos.segundosRestantes !== null) {
      EXAMEN.fin = Date.now() + datos.segundosRestantes * 1000;
      tickReloj();
      EXAMEN.reloj = setInterval(tickReloj, 1000);
    }
  }

  function tickReloj() {
    if (!EXAMEN || !EXAMEN.fin) return;
    const resta = Math.max(0, Math.round((EXAMEN.fin - Date.now()) / 1000));
    const el = document.getElementById('reloj-ex');
    if (el) {
      el.textContent = '⏱ ' + Math.floor(resta / 60) + ':' + String(resta % 60).padStart(2, '0');
      el.classList.toggle('urgente', resta <= 60);
    }
    if (resta === 0) { clearInterval(EXAMEN.reloj); EXAMEN.reloj = null; enviarExamen(true); }
  }

  function sinResponder() {
    return EXAMEN ? EXAMEN.datos.preguntas.filter(p => !EXAMEN.respuestas[p.ID]).length : 0;
  }
  function actualizarProgresoExamen() {
    if (!EXAMEN) return;
    const n = EXAMEN.datos.preguntas.length;
    const el = document.getElementById('progreso-ex');
    if (el) el.textContent = `Respondiste ${n - sinResponder()} de ${n}`;
  }

  function renderEnvio(confirmando, mensaje) {
    const zona = document.getElementById('enviar-ex');
    if (!zona || !EXAMEN) return;
    if (EXAMEN.enviando) {
      zona.innerHTML = '<div class="acciones-ex"><button class="btn-ex" disabled>Corrigiendo…</button></div>';
      return;
    }
    const faltan = sinResponder();
    zona.innerHTML = confirmando
      ? `<div class="confirmar-ex" role="group" aria-label="Confirmar envío">
          ${faltan ? `<strong>Te ${faltan === 1 ? 'falta 1 pregunta' : 'faltan ' + faltan + ' preguntas'} sin responder.</strong> Las preguntas sin responder cuentan como incorrectas.`
                   : '<strong>¿Enviás el examen?</strong> Después de enviarlo no vas a poder cambiar las respuestas.'}
          <div class="acciones-ex">
            <button class="btn-ex" data-accion="confirmar-envio">Sí, enviar examen</button>
            <button class="btn-ex sec" data-accion="seguir-revisando">Seguir revisando</button>
          </div>
        </div>`
      : `<div class="acciones-ex"><button class="btn-ex" data-accion="enviar-examen">Enviar examen</button></div>`;
    if (mensaje) zona.insertAdjacentHTML('beforeend', `<div class="msg-ex" role="alert">${esc(mensaje)}</div>`);
  }

  async function enviarExamen(automatico) {
    if (!EXAMEN || EXAMEN.enviando) return;
    EXAMEN.enviando = true;
    renderEnvio();
    const ex = EXAMEN;
    try {
      const r = await api('enviarExamen', { token: sessionStorage.getItem('alumno_token'),
        idIntento: ex.datos.idIntento, respuestas: ex.respuestas });
      if (r.sesionInvalida) { sesionVencidaAula(); return; }
      if (r.error || !r.ok) {
        // Si ya estaba enviado (por ejemplo desde otra pestaña), se recarga el estado
        if (/ya fue enviado/i.test(r.error || '')) { detenerExamen(); cargarCursos(); return; }
        throw new Error(r.error || 'No se pudo enviar el examen.');
      }
      try { localStorage.removeItem(claveRespuestas(ex.datos.idIntento)); } catch (e) {}
      if (ex.reloj) clearInterval(ex.reloj);
      ex.curso.Examen = r.examen || Object.assign({}, ex.curso.Examen, { EnCurso: false, Aprobado: !!r.aprobado });
      EXAMEN = null;
      mostrarResultado(ex.curso, r, automatico);
    } catch (e) {
      ex.enviando = false;
      renderEnvio(false, (e instanceof TypeError ? 'No hay conexión. Tus respuestas están guardadas: revisá tu internet y tocá Enviar de nuevo.' : e.message));
    }
  }

  function mostrarResultado(curso, r, automatico) {
    const ex = curso.Examen || {};
    const restantes = Number(ex.Restantes) || 0;
    const titulo = r.aprobado ? '¡Aprobaste el examen!' : 'No aprobaste esta vez';
    let texto;
    if (r.aprobado) texto = 'Tu resultado quedó registrado en el instituto.';
    else if (r.tarde) texto = 'El examen llegó fuera de tiempo y no se pudo corregir.';
    else texto = 'Repasá las clases y volvé a intentarlo.';
    if (!r.aprobado) texto += restantes > 0
      ? ` Te ${restantes === 1 ? 'queda 1 intento' : 'quedan ' + restantes + ' intentos'}.`
      : ' Ya usaste todos tus intentos: comunicate con el instituto.';
    vistaCursoEl.innerHTML = `
      <div class="resultado-ex ${r.aprobado ? 'ok' : 'no'}" role="status">
        <div class="ico-ex">${r.aprobado ? ICO_OK : ICO_REPASO}</div>
        ${automatico ? '<p style="margin-bottom:10px">Se terminó el tiempo y el examen se envió solo.</p>' : ''}
        <h2>${titulo}</h2>
        <p>${texto}</p>
        <div class="acciones-ex"><button class="btn-ex" data-accion="volver-curso">Volver al curso</button></div>
      </div>`;
    window.scrollTo(0, 0);
  }

  // Elegir una opción del examen
  vistaCursoEl.addEventListener('change', e => {
    const el = e.target;
    if (!EXAMEN || !el.matches('input[type=radio][data-preg]')) return;
    EXAMEN.respuestas[el.dataset.preg] = el.value;
    el.closest('fieldset').querySelectorAll('.op-ex').forEach(l => l.classList.toggle('elegida', l.contains(el)));
    guardarRespuestas();
    actualizarProgresoExamen();
    if (document.querySelector('#enviar-ex .confirmar-ex')) renderEnvio(true);
  });

  // Un solo manejador para todos los botones de la vista del curso
  vistaCursoEl.addEventListener('click', e => {
    // PDF abierto = contenido visto (el link se abre igual en otra pestaña)
    const pdf = e.target.closest('a.item-cont[data-item]');
    if (pdf) { const c = claseActual(); if (c) registrarItem(c.ID_Clase, pdf.dataset.item); return; }
    const el = e.target.closest('button');
    if (!el) return;
    if (el.dataset.clase !== undefined) seleccionarClase(Number(el.dataset.clase), true);
    else if (el.dataset.video) abrirVideo(el);
    else if (el.dataset.accion === 'completar') alternarCompletada();
    else if (el.dataset.accion === 'volver') volverACursos();
    else if (el.dataset.accion === 'anterior') seleccionarClase(claseIdx - 1, true);
    else if (el.dataset.accion === 'siguiente') seleccionarClase(claseIdx + 1, true);
    else if (el.dataset.accion === 'rendir-examen') { pidiendoConfirmacion = true; renderTarjetaExamen(); }
    else if (el.dataset.accion === 'cancelar-examen') { pidiendoConfirmacion = false; renderTarjetaExamen(); }
    else if (el.dataset.accion === 'empezar-examen') empezarExamen(el);
    else if (el.dataset.accion === 'enviar-examen') renderEnvio(true);
    else if (el.dataset.accion === 'seguir-revisando') renderEnvio(false);
    else if (el.dataset.accion === 'confirmar-envio') enviarExamen(false);
    else if (el.dataset.accion === 'volver-curso') { if (cursoActual) mostrarCurso(cursoActual); }
    else if (el.dataset.accion === 'salir-examen') {
      const conTiempo = EXAMEN && EXAMEN.fin;
      if (!confirm('Tu examen queda empezado y tus respuestas guardadas en este dispositivo. ' +
        (conTiempo ? 'Ojo: el tiempo sigue corriendo. ' : '') + '¿Volver al curso?')) return;
      if (cursoActual) mostrarCurso(cursoActual);
    }
  });

  // Si ya había una sesión activa, entra directo (el servidor valida el token)
  if (sessionStorage.getItem('alumno_token')) { mostrarApp(); }
</script>

</body>
</html>
